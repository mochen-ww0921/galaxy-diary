<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Diary - 星系日记</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>



  <style>
    /* 添加在 index.html 的 <style> 块中 */
#root {
  position: relative;
  z-index: 10;
  width: 100vw;
  height: 100vh;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0; /* 确保在 UI 之下，但背景之上 */
  display: block;
}
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #020205; color: white;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    @keyframes modalEntrance {
      from { opacity: 0; transform: scale(0.9) translateY(30px); filter: blur(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }
    @keyframes dissipateSmoke {
      0% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      100% { opacity: 0; transform: scale(1.1) translateY(-20px); filter: blur(20px); }
    }
    .animate-entrance { animation: modalEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-dissipate { animation: dissipateSmoke 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .tracking-cosmic { letter-spacing: 0.4em; }

    /* Timeline */
    .timeline-track {
      background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(99, 102, 241, 0.2), rgba(255,255,255,0.05));
      background-size: 200% 100%;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px; width: 18px; border-radius: 50%;
      background: #fff; cursor: pointer;
      box-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 30px rgba(99, 102, 241, 0.6);
      border: 2px solid rgba(99, 102, 241, 1);
    }
    #hand-video-preview {
      position: absolute; top: 1rem; left: 1rem; width: 120px; height: 90px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
      transform: scaleX(-1); z-index: 100; pointer-events: none;
      background: black; opacity: 0; visibility: hidden;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.3",
      "react-dom": "https://esm.sh/react-dom@19.2.3",
      "three": "https://esm.sh/three@0.173.0",
      "three/examples/jsm/controls/OrbitControls": "https://esm.sh/three@0.173.0/examples/jsm/controls/OrbitControls.js",
      "@tweenjs/tween.js": "https://esm.sh/@tweenjs/tween.js@23.1.1"
    }
  }
  </script>
  <script type="module" crossorigin src="/galaxy-diary/assets/index-DPjmQomt.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
